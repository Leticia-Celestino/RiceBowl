spring.datasource.url=jdbc:h2:mem:ricebowl;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
logging.level.org.springframework.security=WARN
storage.local.path=${java.io.tmpdir}/ricebowl-test-uploads
storage.public-base-url=http://localhost:8080
api.security.token.secret=test-secret-key-with-at-least-32-characters
app.cors.allowed-origins=http://localhost:5173
