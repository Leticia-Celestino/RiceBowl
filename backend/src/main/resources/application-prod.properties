springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
server.forward-headers-strategy=framework
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
api.security.cookie.secure=${AUTH_COOKIE_SECURE:true}
api.security.cookie.name=${AUTH_COOKIE_NAME:__Host-ricebowl_session}
api.security.email-verification.required=${EMAIL_VERIFICATION_REQUIRED:true}
storage.type=${STORAGE_TYPE:s3}
storage.s3.endpoint=${S3_ENDPOINT}
storage.s3.region=${S3_REGION:auto}
storage.s3.bucket=${S3_BUCKET}
storage.s3.access-key=${S3_ACCESS_KEY}
storage.s3.secret-key=${S3_SECRET_KEY}
security.malware-scan.enabled=${MALWARE_SCAN_ENABLED:true}
