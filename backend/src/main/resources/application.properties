# Config do PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ricebowl}
spring.datasource.username=${DATABASE_USER:ricebowl}
spring.datasource.password=${DATABASE_PASSWORD:ricebowl}
spring.datasource.driver-class-name=org.postgresql.Driver

# Config do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Log de inicialização
logging.level.org.hibernate.SQL=${HIBERNATE_LOG_LEVEL:INFO}

# Autenticação e sessões opacas, revogáveis no servidor
api.security.session.expiration=${AUTH_SESSION_EXPIRATION:PT2H}
api.security.cookie.name=${AUTH_COOKIE_NAME:ricebowl_session}
api.security.cookie.secure=${AUTH_COOKIE_SECURE:false}
api.security.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
api.security.email-verification.required=${EMAIL_VERIFICATION_REQUIRED:false}
api.security.email-verification.expiration=${EMAIL_VERIFICATION_EXPIRATION:PT24H}
api.security.password-reset.expiration=${PASSWORD_RESET_EXPIRATION:PT30M}

app.public-url=${PUBLIC_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Para garantir que o flyway rode antes de tudo e para evitar conflitos 
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Storage local do MVP. ObjectStorage mantém o domínio desacoplado para um adaptador S3 futuro.
storage.type=${STORAGE_TYPE:local}
storage.local.path=${STORAGE_LOCAL_PATH:./data/uploads}
storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:}
storage.s3.signed-url-expiration=${S3_SIGNED_URL_EXPIRATION:PT10M}

security.malware-scan.enabled=${MALWARE_SCAN_ENABLED:false}
security.malware-scan.host=${CLAMAV_HOST:clamav}
security.malware-scan.port=${CLAMAV_PORT:3310}
security.malware-scan.timeout=${CLAMAV_TIMEOUT:PT30S}

# Limites de upload de arquivos (Tamanho máximo)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.draft-retention=${DRAFT_RETENTION:PT24H}
app.draft-cleanup-interval-ms=${DRAFT_CLEANUP_INTERVAL_MS:3600000}
app.draft-cleanup-initial-delay-ms=${DRAFT_CLEANUP_INITIAL_DELAY_MS:60000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
