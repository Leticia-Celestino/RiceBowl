# Config do PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ricebowl}
spring.datasource.username=${DATABASE_USER:ricebowl}
spring.datasource.password=${DATABASE_PASSWORD:ricebowl}
spring.datasource.driver-class-name=org.postgresql.Driver

# Config do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Log de inicialização
logging.level.org.hibernate.SQL=${HIBERNATE_LOG_LEVEL:INFO}

# Config JWT
api.security.token.secret=${JWT_SECRET:ricebowl-dev-secret-key-change-me}
api.security.token.expiration=${JWT_EXPIRATION:PT2H}
api.security.cookie.name=${AUTH_COOKIE_NAME:ricebowl_session}
api.security.cookie.secure=${AUTH_COOKIE_SECURE:false}
api.security.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Para garantir que o flyway rode antes de tudo e para evitar conflitos 
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Storage local do MVP. ObjectStorage mantém o domínio desacoplado para um adaptador S3 futuro.
storage.local.path=${STORAGE_LOCAL_PATH:./data/uploads}
storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:}

# Limites de upload de arquivos (Tamanho máximo)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.draft-retention=${DRAFT_RETENTION:PT24H}
app.draft-cleanup-interval-ms=${DRAFT_CLEANUP_INTERVAL_MS:3600000}
app.draft-cleanup-initial-delay-ms=${DRAFT_CLEANUP_INITIAL_DELAY_MS:60000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
