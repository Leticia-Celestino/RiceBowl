name: Bug
description: Relate um comportamento incorreto e reproduzível.
title: "bug: "
labels: [bug, triage]
body:
  - type: textarea
    id: description
    attributes:
      label: Problema
      description: O que aconteceu e o que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: "1. Abra...\n2. Clique...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: "Browser, sistema operacional e commit"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs ou screenshots
