services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-ricebowl}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ricebowl}
      POSTGRES_DB: ${DATABASE_NAME:-ricebowl}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  uploads-init:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 10001:10001 /data/uploads"]
    user: root
    volumes:
      - uploads-data:/data/uploads
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-ricebowl}
      DATABASE_USER: ${DATABASE_USER:-ricebowl}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-ricebowl}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production}
      STORAGE_LOCAL_PATH: /data/uploads
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5173}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    volumes:
      - uploads-data:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    environment:
      PORT: 80
      API_UPSTREAM: http://api:8080
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  uploads-data:
